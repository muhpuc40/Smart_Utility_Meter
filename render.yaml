# Render Blueprint: Dashboard > New > Blueprint > select this repo
services:
  - type: web
    name: smart-meter-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "2"
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AUTO_APPROVE_RECHARGE
        value: "false"
      - key: METER_ONLINE_SECONDS
        value: "180"
      - key: APP_TIMEZONE
        value: Asia/Dhaka
